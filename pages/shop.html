<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cửa hàng</title>
		
		<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3859487427812629"
     crossorigin="anonymous"></script>

        <link rel="stylesheet" href="/index.css">
        <link rel="stylesheet" href="/css/shop.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.css" integrity="sha512-U9Y1sGB3sLIpZm3ePcrKbXVhXlnQNcuwGQJ2WjPjnp6XHqVTdgIlbaDzJXJIAuCTp3y22t+nhI4B88F/5ldjFA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
		<script src="/pages/translations.js"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
    <header-placeholder></header-placeholder>
  
    <section class="shop-section">
        <div class="shop-header">
            <h2 data-translate-key="shop_title">Cửa hàng in 3D</h2>
            <p data-translate-key="shop_description">Các sản phẩm in 3D chất lượng cao từ nhựa bền, phù hợp để trang trí, làm quà tặng và sử dụng cá nhân.</p>
        </div>

        <div class="product-grid">
            <!-- Placeholder Product Card - You can copy this block to add more products -->
            <div class="product-card">
                <div class="product-image">
                    <img src="https://via.placeholder.com/400x300/1e1e1e/888?text=Sản+phẩm+in+3D" alt="Sản phẩm mẫu">
                </div>
                <div class="product-info">
                    <h3 class="product-name" data-translate-key="product_placeholder_name">Sản phẩm mẫu</h3>
                    <p class="product-price" data-translate-key="product_placeholder_price">Liên hệ để biết giá</p>
                    <a href="#" class="btn-details" data-translate-key="product_btn_details">Xem chi tiết</a>
                </div>
            </div>
            <!-- End of Product Card -->
        </div>
    </section>

    <footer-placeholder></footer-placeholder>

    <script src="/main.js"></script>

    </body>
</html>
