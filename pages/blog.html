		<style>
			:root {
				--primary-color: #00aaff;
				--dark-bg: #121212;
				--light-bg: #1e1e1e;
				--text-color: #e0e0e0;
			}
			.card {
				background: var(--light-bg);
				border-radius: 15px;
				overflow: hidden;
				transition: transform 0.3s ease, box-shadow 0.3s ease;
				border: 1px solid #333;
			}
			.card:hover {
				transform: translateY(-10px);
				box-shadow: 0 10px 20px rgba(0, 170, 255, 0.2);
			}
			.card-info h3 {
				color: var(--primary-color);
			}
			.pagination .page-link {
				color: var(--text-color);
				background-color: transparent;
				border: 1px solid #555;
				margin: 0 4px;
				border-radius: 5px;
			}
			.pagination .page-item.active .page-link {
				background-color: var(--primary-color);
				border-color: var(--primary-color);
				color: #121212;
				font-weight: bold;
			}
			.pagination .page-item:not(.disable) .page-link:hover {
				background-color: #333;
				border-color: #777;
			}
			/* --- Search Bar Styles --- */
			.search-container {
				position: relative;
				width: 80%;
				max-width: 600px;
				margin: 1rem auto 2rem;
			}
			#searchInput {
				width: 100%;
				padding: 12px 20px 12px 45px;
				border-radius: 25px;
				border: 1px solid #555;
				background-color: var(--light-bg);
				color: var(--text-color);
				font-size: 1rem;
				transition: border-color 0.3s, box-shadow 0.3s;
			}
			#searchInput:focus {
				outline: none;
				border-color: var(--primary-color);
				box-shadow: 0 0 10px rgba(0, 170, 255, 0.3);
			}

		</style>

    <body>

    <section>
		<!--<iframe width="100%" height="800px" src="https://hackmd.io/@dajunctic/HkS11r7MC" frameborder="0"></iframe>-->

			</div>
			
			<div class="search-container">
				<input type="text" id="searchInput" placeholder="Tìm kiếm bài viết theo tiêu đề..." data-translate-key="blog_search_placeholder">
			</div>


			<div class='card-content' style="display: none;">
			<!--	<div class='card'>
					
					<div class='card-image'>
						<img src="https://dajunctic.github.io/assets/images/HackMD.jpg" alt="">
						<div class="card-info">

			</div>
			
			
			<div class="pagination">
				<!--
				<li class="page-item previous-page disable"><a class="page-link" href="#">Prev</a></li>
				<li class="page-item current-page active"><a class="page-link" href="#">1</a></li>
				<li class="page-item current-page"><a class="page-link" href="#">2</a></li>

				-->
			</div>

		<script>
			function getPageList(totalPages, page, maxLength) {
				function range(start, end){
					return Array.from(Array(end - start + 1), (_, i) => i + start);
				}
				
				var sideWidth = maxLength < 9 ? 1 : 2;
				var leftWidth = (maxLength - sideWidth * 2 - 3) >> 1;
				var rightWidth = (maxLength - sideWidth * 2 - 3) >> 1;
				
				if (totalPages <= maxLength) {
					return range(1, totalPages);
				}
				
				if (page <= maxLength - sideWidth - 1 - rightWidth) {
					return range(1, maxLength - sideWidth - 1).concat(0, range(totalPages - sideWidth + 1, totalPages));
					
				}
				
				if (page >= totalPages - sideWidth - 1 - rightWidth) {
					return range(1, sideWidth).concat(0, range(totalPages - sideWidth - 1 - rightWidth - leftWidth, totalPages));
				}
				
				return range(1, sideWidth).concat(0, range(page - leftWidth, page + rightWidth), 0, range(totalPages - sideWidth + 1, totalPages));
			}

			
			$(function(){
				// Display Card Content
				
				$.get( "https://dajunctic.github.io/assets/data/blog.csv", function(CSVdata) {
					var data = $.csv.toObjects(CSVdata);
					
					for (let i = 0; i < data.length; i ++) {
						var title = data[i].title;
						var date = data[i].date;
						var url = data[i].url;

						$(".card-content").append(
							$("<div>").addClass("card").append(
								
								$("<div>").addClass("card-image").append(
									$("<img>").attr({"src": "https://dajunctic.github.io/assets/images/HackMD.jpg"}),
									$("<div>").addClass("card-info").append(
										$("<h3>").text(title),
										$("<a>").attr({"href": url}).addClass("hidden"),
										$("<p>").append(
											$("<i>").addClass("fa-regular fa-clock"), // Assuming Font Awesome
											" " + date
										)
									)
								)
							)
						);						
					}
					
					$(".card").on("click", function() {
						window.open($(this).find("a").attr("href"), "_blank"); // Open link in new tab
				  	});
					
					
					// Display Pagination
					var numberOfItems = $(".card-content .card").length;
					var limitPerPage = 6; // Card per Page
					var totalPages = Math.ceil(numberOfItems / limitPerPage);

					var paginationSize = 7; // page element visible in the pagination
					var currentPage;

					function showPage(whichPage){
						var $cards = $(".card-content .card:visible");
						var totalPages = Math.ceil($cards.length / limitPerPage);

						if (whichPage < 1 || whichPage > totalPages) return false;

						currentPage = whichPage;

						$cards.hide().slice((currentPage - 1) * limitPerPage, currentPage * limitPerPage).show();

						$(".pagination li").slice(1, -1).remove();

						getPageList(totalPages, currentPage, paginationSize).forEach(item => {
							$("<li>").addClass("page-item").addClass(item ? "current-page" : "dots")
							.toggleClass("active", item===currentPage).append($("<a>").addClass("page-link")
							.attr({href: "javascript:void(0)"}).text(item || "...")).insertBefore(".next-page");
						});

						$(".previous-page").toggleClass("disable", currentPage === 1);
						$(".next-page").toggleClass("disable", currentPage === totalPages);
						return true;
					}

					$(".pagination").append(
						$("<li>").addClass("page-item").addClass("previous-page").append($("<a>").addClass("page-link")
						.attr({href: "javascript:void(0)"}).attr("data-translate-key", "blog_prev").text("Prev")),
						$("<li>").addClass("page-item").addClass("next-page").append($("<a>").addClass("page-link")
						.attr({href: "javascript:void(0)"}).attr("data-translate-key", "blog_next").text("Next")),
					);

					$(".card-content").show();
					showPage(1);

					$(document).on("click", ".pagination li.current-page:not(.active)", function(){
						return showPage(+$(this).text());
					});

					$(".next-page").on("click", function(){
						return showPage(currentPage + 1);
					});

					$(".previous-page").on("click", function(){
						return showPage(currentPage - 1);
					});

					// Search functionality
					$("#searchInput").on("keyup", function() {
						var searchTerm = $(this).val().toLowerCase();
						$(".card-content .card").hide().filter(function() {
							return $(this).find("h3").text().toLowerCase().includes(searchTerm);
						}).show();
						// Reset to the first page of search results
						showPage(1);
					});

				});
			});
			
		</script>
