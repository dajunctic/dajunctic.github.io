    <body>
    <header-placeholder></header-placeholder>
  
    <section class="artwork-section" style="text-align: center; color: white;">
        <div class="section-title" style="margin-bottom: 3rem;">
            <h2 style="font-size: 2.5rem; margin-bottom: 1rem;" data-translate-key="artwork_title">Bộ sưu tập Tác phẩm</h2>
            <p style="font-size: 1.1rem; max-width: 700px; margin: auto; color: #ccc;" data-translate-key="artwork_description">Nơi tôi lưu giữ những khoảnh khắc sáng tạo, từ những bản vẽ kỹ thuật số đến các dự án thiết kế nhỏ.</p>

        <div class="gallery" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">

            <div class="gallery-item" style="background: #1e1e1e; padding: 10px; border-radius: 10px; width: 300px;">

                <p style="color: #aaa; font-size: 0.9rem;" data-translate-key="artwork_item_desc">Bản concept art - 2024</p>
